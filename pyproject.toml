[project]
name = "phibench-mi210"
version = "0.1.0"
description = "Turn GEAK kernel-agent results on AMD MI210 into Φ-Bench task rows, calibrate them, and check them before a merge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phibench_mi210"]

[tool.pytest.ini_options]
testpaths = ["tests"]
